<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagramas LevantApp</title>
<style>
:root{--bg:#f8fafc;--fg:#0f172a;--mut:#475569;--card:#ffffff;--line:#94a3b8;--auto:#0d9488;--hum:#b45309;--human-bg:#fffbeb;--auto-bg:#f0fdfa}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--fg:#e2e8f0;--mut:#94a3b8;--card:#111a2e;--line:#475569;--auto:#2dd4bf;--hum:#fbbf24;--human-bg:#2a2108;--auto-bg:#08231f}}
:root[data-theme="dark"]{--bg:#0b1220;--fg:#e2e8f0;--mut:#94a3b8;--card:#111a2e;--line:#475569;--auto:#2dd4bf;--hum:#fbbf24;--human-bg:#2a2108;--auto-bg:#08231f}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1000px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px} .lead{color:var(--mut);margin:0 0 28px}
figure{margin:0 0 36px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;overflow-x:auto}
figure h2{font-size:17px;margin:0 0 10px}
svg{width:100%;min-width:760px;height:auto;display:block;color:var(--fg);font-family:inherit}
figcaption{position:sticky;left:0;color:var(--mut);font-size:13px;margin-top:10px}
.bx{fill:var(--card);stroke:var(--line);stroke-width:1.4}
.bx.cond{fill:var(--card)} .bx.auto{fill:var(--auto-bg);stroke:var(--auto)} .bx.hum{fill:var(--human-bg);stroke:var(--hum);stroke-dasharray:5 3}
.grp{fill:none;stroke:var(--line);stroke-dasharray:4 4} .gt{fill:var(--mut);letter-spacing:.06em}
.ln{stroke:currentColor;stroke-width:1.5;opacity:.75} .ln.hum{stroke:var(--hum);stroke-dasharray:5 3;opacity:1;color:var(--hum)}
.sub,.lb,.note{fill:var(--mut)} text{fill:currentColor}
.leg{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:10px}
.sw{display:inline-block;width:26px;height:12px;border-radius:3px;vertical-align:middle;margin-right:6px;border:1.5px solid}
.sw.a{background:var(--auto-bg);border-color:var(--auto)} .sw.h{background:var(--human-bg);border-color:var(--hum);border-style:dashed}
</style></head><body><main>
<h1>LevantApp · diagramas</h1><p class="lead">Cómo se conecta el sistema y cómo decide el agente de correo.</p>
<figure><h2>Cómo se conecta todo</h2><svg viewBox="0 20 1020 430" role="img" aria-label="La app guarda cada registro en una cola local y la envía al servidor de Apps Script, que escribe en la hoja de Google, sube fotos a Drive, envía correos por Gmail y se conecta con Gemini y WhatsApp." xmlns="http://www.w3.org/2000/svg"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="grp" x="14" y="30" width="286" height="410" rx="12"/><text class="gt" x="30" y="52" font-size="12">DISPOSITIVO (celular o PC)</text><rect class="bx " x="34" y="80" width="246" height="64" rx="8"/><text x="157.0" y="109.0" text-anchor="middle" font-size="13" font-weight="600">App LevantApp (PWA)</text><text class="sub" x="157.0" y="126.0" text-anchor="middle" font-size="11">formularios · Service Worker</text><rect class="bx " x="34" y="190" width="246" height="64" rx="8"/><text x="157.0" y="219.0" text-anchor="middle" font-size="13" font-weight="600">Cola de envío</text><text class="sub" x="157.0" y="236.0" text-anchor="middle" font-size="11">localStorage · reintenta 5 s → 5 min</text><rect class="bx " x="34" y="300" width="246" height="64" rx="8"/><text x="157.0" y="329.0" text-anchor="middle" font-size="13" font-weight="600">Fotos del equipo</text><text class="sub" x="157.0" y="346.0" text-anchor="middle" font-size="11">IndexedDB · comprimidas</text><polyline class="ln " points="157,144 157,190" fill="none" marker-end="url(#a)"/><text class="lb" x="222" y="172" text-anchor="middle" font-size="11">1. guarda primero</text><text class="note" x="30" y="404" font-size="11">Sin señal: el registro espera en la cola</text><text class="note" x="30" y="420" font-size="11">y sale solo al volver la conexión.</text><rect class="bx " x="470" y="110" width="170" height="240" rx="8"/><text x="555.0" y="234.0" text-anchor="middle" font-size="13" font-weight="600"></text><text x="555" y="196" text-anchor="middle" font-size="13" font-weight="600">Apps Script</text><text class="sub" x="555" y="216" text-anchor="middle" font-size="11">Codigo.gs · web app /exec</text><text class="sub" x="555" y="238" text-anchor="middle" font-size="11">valida permisos</text><text class="sub" x="555" y="256" text-anchor="middle" font-size="11">un candado a la vez</text><polyline class="ln " points="280,222 470,222" fill="none" marker-end="url(#a)"/><text class="lb" x="375" y="214" text-anchor="middle" font-size="11">2. POST {action}</text><polyline class="ln " points="280,332 470,332" fill="none" marker-end="url(#a)"/><text class="lb" x="375" y="324" text-anchor="middle" font-size="11">fotos en base64</text><polyline class="ln " points="470,122 280,122" fill="none" marker-end="url(#a)"/><text class="lb" x="375" y="114" text-anchor="middle" font-size="11">pull: tickets y catálogos</text><polyline class="ln" points="640,230 685,230" fill="none"/><line class="ln" x1="685" y1="78" x2="685" y2="398"/><rect class="bx " x="800" y="50" width="200" height="56" rx="8"/><text x="900.0" y="75.0" text-anchor="middle" font-size="13" font-weight="600">Hoja de Google</text><text class="sub" x="900.0" y="92.0" text-anchor="middle" font-size="11">22 hojas: tickets, usuarios, bodega</text><polyline class="ln " points="685,78 800,78" fill="none" marker-end="url(#a)"/><text class="lb" x="742.5" y="70" text-anchor="middle" font-size="11">lee y escribe</text><rect class="bx " x="800" y="130" width="200" height="56" rx="8"/><text x="900.0" y="155.0" text-anchor="middle" font-size="13" font-weight="600">Drive</text><text class="sub" x="900.0" y="172.0" text-anchor="middle" font-size="11">fotos de antes y después</text><polyline class="ln " points="685,158 800,158" fill="none" marker-end="url(#a)"/><text class="lb" x="742.5" y="150" text-anchor="middle" font-size="11">sube fotos</text><rect class="bx " x="800" y="210" width="200" height="56" rx="8"/><text x="900.0" y="235.0" text-anchor="middle" font-size="13" font-weight="600">Gmail (MailApp)</text><text class="sub" x="900.0" y="252.0" text-anchor="middle" font-size="11">avisos por correo</text><polyline class="ln " points="685,238 800,238" fill="none" marker-end="url(#a)"/><text class="lb" x="742.5" y="230" text-anchor="middle" font-size="11">envía avisos</text><rect class="bx " x="800" y="290" width="200" height="56" rx="8"/><text x="900.0" y="315.0" text-anchor="middle" font-size="13" font-weight="600">Gemini</text><text class="sub" x="900.0" y="332.0" text-anchor="middle" font-size="11">lectura de documentos con IA</text><polyline class="ln " points="685,318 800,318" fill="none" marker-end="url(#a)"/><text class="lb" x="742.5" y="310" text-anchor="middle" font-size="11">lee planillas</text><rect class="bx " x="800" y="370" width="200" height="56" rx="8"/><text x="900.0" y="395.0" text-anchor="middle" font-size="13" font-weight="600">WhatsApp (Meta)</text><text class="sub" x="900.0" y="412.0" text-anchor="middle" font-size="11">bot de levantamiento</text><polyline class="ln " points="685,398 800,398" fill="none" marker-end="url(#a)" marker-start="url(#a)"/><text class="lb" x="742.5" y="390" text-anchor="middle" font-size="11">mensajes ⇄</text></svg>
<figcaption>La app guarda primero en el equipo y envía después: si no hay señal, el registro espera en la cola. El servidor es un único Apps Script que escribe en la hoja, guarda las fotos en Drive y envía los correos desde Gmail.</figcaption></figure>
<figure><h2>El agente de Outlook: qué hace solo y qué deriva</h2><svg viewBox="0 0 1030 524" role="img" aria-label="El agente clasifica cada correo de Outlook: actúa solo en fallas claras, preguntas de dato faltante, emergencias, consultas y notificaciones; deriva a una persona los cambios de ruta, prioridad, cierre y compras, y los correos sospechosos." xmlns="http://www.w3.org/2000/svg"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="bx " x="14" y="228.0" width="140" height="68" rx="8"/><text x="84.0" y="258.0" text-anchor="middle" font-size="12" font-weight="600">Bandeja</text><text x="84.0" y="274.0" text-anchor="middle" font-size="12" font-weight="600">de Outlook</text><rect class="bx " x="190" y="222.0" width="150" height="80" rx="8"/><text x="265.0" y="250.0" text-anchor="middle" font-size="12" font-weight="600">Agente</text><text x="265.0" y="266.0" text-anchor="middle" font-size="12" font-weight="600">lee, clasifica</text><text x="265.0" y="282.0" text-anchor="middle" font-size="12" font-weight="600">y extrae datos</text><polyline class="ln " points="154,262.0 190,262.0" fill="none" marker-end="url(#a)"/><polyline class="ln" points="340,262.0 376,262.0" fill="none"/><line class="ln" x1="376" y1="46.0" x2="376" y2="478.0"/><rect class="bx cond" x="400" y="16" width="210" height="60" rx="8"/><text x="505.0" y="42.0" text-anchor="middle" font-size="12" font-weight="600">Falla clara</text><text x="505.0" y="58.0" text-anchor="middle" font-size="12" font-weight="600">colegio único</text><polyline class="ln " points="376,46.0 400,46.0" fill="none" marker-end="url(#a)"/><rect class="bx auto" x="720" y="16" width="290" height="60" rx="8"/><text x="865.0" y="42.0" text-anchor="middle" font-size="12" font-weight="600">Crea el ticket</text><text x="865.0" y="58.0" text-anchor="middle" font-size="12" font-weight="600">y responde con el N°</text><polyline class="ln " points="610,46.0 720,46.0" fill="none" marker-end="url(#a)"/><text class="lb" x="665.0" y="39.0" text-anchor="middle" font-size="11">el agente actúa</text><rect class="bx cond" x="400" y="88" width="210" height="60" rx="8"/><text x="505.0" y="114.0" text-anchor="middle" font-size="12" font-weight="600">Colegio ausente</text><text x="505.0" y="130.0" text-anchor="middle" font-size="12" font-weight="600">o ambiguo</text><polyline class="ln " points="376,118.0 400,118.0" fill="none" marker-end="url(#a)"/><rect class="bx auto" x="720" y="88" width="290" height="60" rx="8"/><text x="865.0" y="114.0" text-anchor="middle" font-size="12" font-weight="600">Pregunta un solo dato</text><text x="865.0" y="130.0" text-anchor="middle" font-size="12" font-weight="600">no crea ticket todavía</text><polyline class="ln " points="610,118.0 720,118.0" fill="none" marker-end="url(#a)"/><text class="lb" x="665.0" y="111.0" text-anchor="middle" font-size="11">el agente actúa</text><rect class="bx cond" x="400" y="160" width="210" height="60" rx="8"/><text x="505.0" y="194.0" text-anchor="middle" font-size="12" font-weight="600">Emergencia</text><polyline class="ln " points="376,190.0 400,190.0" fill="none" marker-end="url(#a)"/><rect class="bx auto" x="720" y="160" width="290" height="60" rx="8"/><text x="865.0" y="186.0" text-anchor="middle" font-size="12" font-weight="600">Ticket EMG (Alta); avisa a</text><text x="865.0" y="202.0" text-anchor="middle" font-size="12" font-weight="600">Infraestructura y al gestor</text><polyline class="ln " points="610,190.0 720,190.0" fill="none" marker-end="url(#a)"/><text class="lb" x="665.0" y="183.0" text-anchor="middle" font-size="11">el agente actúa</text><rect class="bx cond" x="400" y="232" width="210" height="60" rx="8"/><text x="505.0" y="266.0" text-anchor="middle" font-size="12" font-weight="600">Consulta de estado</text><polyline class="ln " points="376,262.0 400,262.0" fill="none" marker-end="url(#a)"/><rect class="bx auto" x="720" y="232" width="290" height="60" rx="8"/><text x="865.0" y="258.0" text-anchor="middle" font-size="12" font-weight="600">Consulta el ticket y responde</text><text x="865.0" y="274.0" text-anchor="middle" font-size="12" font-weight="600">(solo del colegio del remitente)</text><polyline class="ln " points="610,262.0 720,262.0" fill="none" marker-end="url(#a)"/><text class="lb" x="665.0" y="255.0" text-anchor="middle" font-size="11">el agente actúa</text><rect class="bx cond" x="400" y="304" width="210" height="60" rx="8"/><text x="505.0" y="330.0" text-anchor="middle" font-size="12" font-weight="600">Ruta, prioridad,</text><text x="505.0" y="346.0" text-anchor="middle" font-size="12" font-weight="600">cierre o compras</text><polyline class="ln " points="376,334.0 400,334.0" fill="none" marker-end="url(#a)"/><rect class="bx hum" x="720" y="304" width="290" height="60" rx="8"/><text x="865.0" y="330.0" text-anchor="middle" font-size="12" font-weight="600">Deriva a una persona</text><text x="865.0" y="346.0" text-anchor="middle" font-size="12" font-weight="600">con resumen de 3 líneas</text><polyline class="ln hum" points="610,334.0 720,334.0" fill="none" marker-end="url(#a)"/><text class="lb" x="665.0" y="327.0" text-anchor="middle" font-size="11">persona decide</text><rect class="bx cond" x="400" y="376" width="210" height="60" rx="8"/><text x="505.0" y="402.0" text-anchor="middle" font-size="12" font-weight="600">Notificación automática</text><text x="505.0" y="418.0" text-anchor="middle" font-size="12" font-weight="600">de LevantApp</text><polyline class="ln " points="376,406.0 400,406.0" fill="none" marker-end="url(#a)"/><rect class="bx auto" x="720" y="376" width="290" height="60" rx="8"/><text x="865.0" y="402.0" text-anchor="middle" font-size="12" font-weight="600">Etiqueta y archiva</text><text x="865.0" y="418.0" text-anchor="middle" font-size="12" font-weight="600">no responde</text><polyline class="ln " points="610,406.0 720,406.0" fill="none" marker-end="url(#a)"/><text class="lb" x="665.0" y="399.0" text-anchor="middle" font-size="11">el agente actúa</text><rect class="bx cond" x="400" y="448" width="210" height="60" rx="8"/><text x="505.0" y="474.0" text-anchor="middle" font-size="12" font-weight="600">Pide ignorar reglas</text><text x="505.0" y="490.0" text-anchor="middle" font-size="12" font-weight="600">o abrir enlaces</text><polyline class="ln " points="376,478.0 400,478.0" fill="none" marker-end="url(#a)"/><rect class="bx hum" x="720" y="448" width="290" height="60" rx="8"/><text x="865.0" y="474.0" text-anchor="middle" font-size="12" font-weight="600">Etiqueta Sospechoso y</text><text x="865.0" y="490.0" text-anchor="middle" font-size="12" font-weight="600">avisa a Infraestructura</text><polyline class="ln hum" points="610,478.0 720,478.0" fill="none" marker-end="url(#a)"/><text class="lb" x="665.0" y="471.0" text-anchor="middle" font-size="11">persona decide</text></svg>
<div class="leg"><span><i class="sw a"></i>lo hace el agente</span><span><i class="sw h"></i>lo decide una persona</span></div>
<figcaption>El agente solo crea tickets o responde; nunca cambia prioridades, cierra tickets ni aprueba gastos. Ante la duda, deriva con un resumen de tres líneas.</figcaption></figure>
</main></body></html>
